version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major versions are migrations (Next.js, Tailwind, TypeScript, lucide icon renames),
      # done deliberately by hand. Dependabot sends the minor and patch updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per family instead of one per package.
      tiptap:
        patterns: ["@tiptap/*"]
      radix:
        patterns: ["@radix-ui/*"]
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
